# Test on every PR and push; build the image on every PR; push to Docker Hub only on push to main or version tags.
# Repo secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (Hub access token, not account password).
name: Docker Image CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: carloperassi/aristowrap

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --extra dev --frozen

      - name: Test
        run: uv run pytest tests/ -q --cov=scripts.aristowrap --cov-report=term-missing

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build . --file Dockerfile --tag "${IMAGE}:ci"

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push branch main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          SHORT="${GITHUB_SHA:0:7}"
          docker tag "${IMAGE}:ci" "${IMAGE}:main"
          docker tag "${IMAGE}:ci" "${IMAGE}:latest"
          docker tag "${IMAGE}:ci" "${IMAGE}:${SHORT}"
          docker push "${IMAGE}:main"
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${SHORT}"

      - name: Push release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          docker tag "${IMAGE}:ci" "${IMAGE}:${VERSION}"
          docker tag "${IMAGE}:ci" "${IMAGE}:latest"
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"
